name: Aktualizacja planów

on:
  schedule:
    # Około 5:00 i 17:00 czasu polskiego (cron w UTC; Polska ma +1 zimą i +2 latem).
    # GitHub bywa spóźniony o kilka godzin — to nie przeszkadza.
    - cron: "17 3,15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "ewiglookup.config.json", ".github/workflows/pages.yml"]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write # publikacja strony
  id-token: write # wymagane przez actions/deploy-pages
  actions: write # tylko do podtrzymania harmonogramu (ostatni krok)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja
        run: |
          python -m pip install --quiet uv
          uv sync --frozen --no-dev

      - name: Plany wszystkich grup z ewig
        env:
          EWIG_LOGIN: ${{ secrets.EWIG_LOGIN }}
          EWIG_PASSWORD: ${{ secrets.EWIG_PASSWORD }}
          # token gcalsync (tylko odczyt kalendarzy planów naszych grup); bez niego plany z ewig
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        # Przy błędzie (ewig nie działa, za dużo nieudanych grup) zadanie kończy się błędem
        # i strona nie jest publikowana — zostaje poprzednia wersja.
        run: uv run --frozen --no-dev ewiglookup fetch --out site/data.json --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # W publicznym repo GitHub wyłącza harmonogram po 60 dniach bez aktywności w repo.
  # Ponowne „włączenie” workflow przez API zeruje ten licznik — bez sztucznych commitów.
  keepalive:
    if: always() && github.event_name == 'schedule'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api --silent -X PUT "repos/$REPO/actions/workflows/pages.yml/enable"
