[project]
name = "ewiglookup"
version = "0.1.0"
description = "Plany zajęć prowadzących i sal WIG WAT (z planów grup w e-Dziekanacie ewig)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
]

[project.scripts]
ewiglookup = "ewiglookup.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ewiglookup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Komunikaty i komentarze są po polsku; RUF001-003 zgłaszają „niejednoznaczne” znaki Unicode.
ignore = ["RUF001", "RUF002", "RUF003"]
